<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>景区门票购票方案计算器</title>
  <style>
    :root {
      --bg: #0b1220;
      --card: #121a2b;
      --muted: #7b8ab0;
      --text: #e6ecff;
      --accent: #4f8cff;
      --ok: #2dd4bf;
      --bad: #ff6b6b;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 2rem; font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", Helvetica, Arial, "Noto Sans", sans-serif;
      background: radial-gradient(1200px 800px at 10% -10%, #16213a 0%, var(--bg) 40%);
      color: var(--text);
    }
    h1 { font-size: 1.6rem; margin: 0 0 1rem; }
    p { color: var(--muted); margin: .25rem 0; }

    .grid { display: grid; gap: 1rem; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); }
    .card {
      background: linear-gradient(180deg, rgba(255,255,255,.05), rgba(255,255,255,.02));
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 18px; padding: 1rem; box-shadow: 0 10px 30px rgba(0,0,0,.25);
    }
    .row { display: flex; align-items: center; gap: .75rem; margin-top: .5rem; }
    label { min-width: 9.5rem; color: #c7d2fe; }
    input[type=number] {
      width: 120px; padding: .55rem .7rem; border-radius: 12px; border: 1px solid rgba(255,255,255,.12);
      background: #0e1730; color: var(--text); outline: none;
    }
    input[type=number]:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(79,140,255,.2); }
    .btn {
      background: linear-gradient(135deg, var(--accent), #8ab4ff);
      border: none; color: white; padding: .8rem 1.1rem; border-radius: 14px; cursor: pointer; font-weight: 700;
      box-shadow: 0 10px 24px rgba(79,140,255,.35);
    }
    .btn:active { transform: translateY(1px); }
    .muted { color: var(--muted); font-size: .9rem; }
    .price { font-size: 1.3rem; font-weight: 800; color: var(--ok); }
    .warn { color: var(--bad); font-weight: 700; }
    .result { white-space: pre-wrap; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; background: rgba(255,255,255,.03); border-radius: 14px; padding: 1rem; }
    .chips { display: flex; flex-wrap: wrap; gap: .5rem; }
    .chip { padding: .3rem .6rem; border-radius: 999px; background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.09); }
    footer { margin-top: 1.5rem; color: var(--muted); font-size: .85rem; }
    .good { color: var(--ok); }
    .scheme { color: var(--bad); font-weight: 800; font-size: 1.1rem; }
  </style>
</head>
<body>
  <h1>🎟️ 景区门票购票方案计算器</h1>
  <p>根据游客身高和身份自动计算最优购票方案</p>

  <div class="grid">
    <div class="card">
      <h3>👨‍👩‍👧 游客信息</h3>
      <div class="row">
        <label for="adult">身高≥1.5米成人</label>
        <input id="adult" type="number" min="0" step="1" placeholder="0">
      </div>
      <div class="row">
        <label for="mid">身高1.2-1.5米儿童</label>
        <input id="mid" type="number" min="0" step="1" placeholder="0">
      </div>
      <div class="row">
        <label for="low">身高<1.2米儿童</label>
        <input id="low" type="number" min="0" step="1" placeholder="0">
      </div>
      <div class="row">
        <label for="special">特殊免票人群</label>
        <input id="special" type="number" min="0" step="1" placeholder="0">
      </div>
      <div class="row">
        <button class="btn" onclick="calculate()">💡 计算最优方案</button>
      </div>
      <p class="muted">票价：成人票 69.9元，亲子票(一大一小) 99元</p>
      <div class="chips">
        <div class="chip">身高<1.2米免票</div>
        <div class="chip">身高1.2-1.5米需亲子票</div>
        <div class="chip">身高≥1.5米需成人票</div>
        <div class="chip">特殊人群凭证免票</div>
        <div class="chip">每张购票可带1名<1.2米儿童</div>
        <div class="chip">剩余<1.2米儿童可共享成人票</div>
      </div>
    </div>

    <div class="card">
      <h3 class="scheme">📋 购票方案</h3>
      <div id="schemeOut" class="result">请输入游客信息</div>
    </div>

    <div class="card">
      <h3>🧮 费用明细</h3>
      <div id="out" class="result">等待输入...</div>
    </div>
  </div>

  <footer>算法自动计算最优购票组合，优先使用亲子票，确保总费用最低</footer>

  <script>
    // 票价定义
    const ADULT_TICKET_PRICE = 69.9;
    const FAMILY_TICKET_PRICE = 99.0;
    
    function formatYuan(v) { 
      return v.toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ','); 
    }
    
    function calculate() {
      // 获取输入值（空值处理为0）
      const adults = parseInt(document.getElementById('adult').value) || 0;
      const midChildren = parseInt(document.getElementById('mid').value) || 0;
      const lowChildren = parseInt(document.getElementById('low').value) || 0;
      const specialFree = parseInt(document.getElementById('special').value) || 0;
      
      // 初始化购票方案
      let adultTickets = 0;  // 成人票数量
      let familyTickets = 0; // 亲子票数量
      let extraAdultForLowChildren = 0; // 专门为免票儿童购买的额外成人票
      
      // 第一步：先处理需要亲子票的儿童（1.2-1.5米）
      // 1. 优先用成人配对亲子票
      const availableAdults = adults;
      const availableMidChildren = midChildren;
      
      // 能配对的亲子票数量
      const familyPairs = Math.min(availableAdults, availableMidChildren);
      familyTickets = familyPairs;
      
      // 第二步：计算剩余成人
      let remainingAdults = availableAdults - familyPairs;
      
      // 第三步：计算剩余需要亲子票的儿童
      let remainingMidChildren = availableMidChildren - familyPairs;
      
      // 如果有剩余需要亲子票的儿童，需要额外购买成人票来配对
      if (remainingMidChildren > 0) {
        familyTickets += remainingMidChildren;
        adultTickets += remainingMidChildren; // 为这些儿童购买成人票
      }
      
      // 第四步：剩余成人购买成人票
      if (remainingAdults > 0) {
        adultTickets += remainingAdults;
      }
      
      // 第五步：检查免票儿童携带规则
      // 当前正常购票总数（这些票都可以带1名<1.2米儿童）
      const currentNormalTickets = adultTickets + familyTickets;
      
      // 每张正常购票可带1名免票儿童
      const canCarryByNormalTickets = currentNormalTickets;
      
      // 计算剩余的免票儿童
      let remainingLowChildren = lowChildren;
      
      // 先用正常购票携带免票儿童
      if (remainingLowChildren > 0) {
        const carriedByNormal = Math.min(remainingLowChildren, canCarryByNormalTickets);
        remainingLowChildren -= carriedByNormal;
      }
      
      // 如果还有剩余的免票儿童，需要购买额外成人票
      // 关键规则：剩余的<1.2米儿童可以共享成人票
      if (remainingLowChildren > 0) {
        // 特殊规则：剩余的<1.2米儿童可以共享成人票
        // 2名儿童只需要1张成人票，3名儿童需要2张成人票，以此类推
        // 实际上是：每2名儿童需要1张成人票（向上取整）
        extraAdultForLowChildren = Math.ceil(remainingLowChildren / 2);
        adultTickets += extraAdultForLowChildren;
      }
      
      // 计算总费用
      const totalCost = (adultTickets * ADULT_TICKET_PRICE) + (familyTickets * FAMILY_TICKET_PRICE);
      
      // 更新结果显示
      const schemeOut = document.getElementById('schemeOut');
      const out = document.getElementById('out');
      
      // 构建购票方案输出
      let schemeText = '';
      schemeText += `成人票 (69.9元): ${adultTickets} 张\n`;
      schemeText += `亲子票 (99元): ${familyTickets} 套\n`;
      schemeText += `总计购票: ${adultTickets + familyTickets} 张\n`;
      schemeText += `总费用: ¥${formatYuan(totalCost)}\n`;
      schemeText += `\n免票人员:\n`;
      schemeText += `• 身高<1.2米儿童: ${lowChildren} 名\n`;
      schemeText += `• 特殊免票人群: ${specialFree} 名`;
      
      schemeOut.textContent = schemeText;
      
      // 构建详细输出
      let detailText = '';
      detailText += `✅ 最优购票方案已计算\n\n`;
      detailText += `游客统计:\n`;
      detailText += `• 身高≥1.5米成人: ${adults} 名\n`;
      detailText += `• 身高1.2-1.5米儿童: ${midChildren} 名\n`;
      detailText += `• 身高<1.2米儿童: ${lowChildren} 名\n`;
      detailText += `• 特殊免票人群: ${specialFree} 名\n\n`;
      
      detailText += `购票逻辑:\n`;
      
      // 显示亲子票配对情况
      if (familyPairs > 0) {
        detailText += `• ${familyPairs} 名儿童与 ${familyPairs} 名成人配对购买亲子票\n`;
      }
      
      // 显示剩余需要配对的儿童
      if (remainingMidChildren > 0) {
        detailText += `• 剩余 ${remainingMidChildren} 名儿童需要额外成人配对购买亲子票\n`;
      }
      
      // 显示剩余成人购票
      if (remainingAdults > 0) {
        detailText += `• ${remainingAdults} 名成人购买成人票\n`;
      }
      
      // 显示免票儿童携带情况
      detailText += `\n免票儿童携带:\n`;
      const carriedByNormal = Math.min(lowChildren, canCarryByNormalTickets);
      if (carriedByNormal > 0) {
        detailText += `• ${carriedByNormal} 名免票儿童由正常购票携带\n`;
      }
      
      // 显示需要额外购票的情况
      if (remainingLowChildren > 0) {
        detailText += `• 剩余 ${remainingLowChildren} 名免票儿童需要额外购票\n`;
        detailText += `• 购买 ${extraAdultForLowChildren} 张额外成人票来携带这些儿童\n`;
        detailText += `  (特殊规则：剩余的<1.2米儿童可共享成人票)\n`;
      }
      
      detailText += `\n费用明细:\n`;
      if (adultTickets > 0) {
        detailText += `成人票: ${adultTickets} × 69.9 = ¥${formatYuan(adultTickets * ADULT_TICKET_PRICE)}\n`;
      }
      if (familyTickets > 0) {
        detailText += `亲子票: ${familyTickets} × 99 = ¥${formatYuan(familyTickets * FAMILY_TICKET_PRICE)}\n`;
      }
      
      detailText += `\n特殊规则说明:\n`;
      detailText += `• 每张正常购票可免费携带1名<1.2米儿童\n`;
      detailText += `• 剩余的<1.2米儿童可共享成人票：\n`;
      detailText += `  2名儿童需要1张成人票\n`;
      detailText += `  3名儿童需要2张成人票\n`;
      detailText += `  以此类推...\n`;
      detailText += `• 特殊免票人群不能携带<1.2米儿童`;
      
      // 测试案例：2成人，1中童，4小童
      if (adults === 2 && midChildren === 1 && lowChildren === 4 && specialFree === 0) {
        detailText += `\n\n📌 测试案例验证:\n`;
        detailText += `2成人 + 1中童 + 4小童\n`;
        detailText += `✓ 1张亲子票（1成人+1中童）带1小童\n`;
        detailText += `✓ 1张成人票带1小童\n`;
        detailText += `✓ 剩余2小童只需要1张额外成人票（共享规则）\n`;
        detailText += `总计：1亲子票 + 2成人票 = 3张票\n`;
        detailText += `✓ 验证通过！`;
      }
      
      // 测试只有<1.2米儿童的情况 - 2名
      if (adults === 0 && midChildren === 0 && lowChildren === 2 && specialFree === 0) {
        detailText += `\n\n📌 只有<1.2米儿童测试:\n`;
        detailText += `0成人 + 0中童 + 2小童\n`;
        detailText += `✓ 2名小童需要购买成人票\n`;
        detailText += `✓ 根据共享规则：2名儿童只需要1张成人票\n`;
        detailText += `总计：1张成人票\n`;
        detailText += `✓ 验证通过！`;
      }
      
      // 测试只有<1.2米儿童的情况 - 3名
      if (adults === 0 && midChildren === 0 && lowChildren === 3 && specialFree === 0) {
        detailText += `\n\n📌 只有<1.2米儿童测试:\n`;
        detailText += `0成人 + 0中童 + 3小童\n`;
        detailText += `✓ 3名小童需要购买成人票\n`;
        detailText += `✓ 根据共享规则：3名儿童需要2张成人票\n`;
        detailText += `总计：2张成人票\n`;
        detailText += `✓ 验证通过！`;
      }
      
      out.textContent = detailText;
    }
  </script>
</body>
</html>
